[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer', 'php83Extensions.pdo_mysql', 'php83Extensions.mbstring', 'php83Extensions.fileinfo']

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader --no-interaction',
    'php artisan storage:link'
]

[start]
cmd = 'php artisan migrate --force && php artisan db:seed --force && php artisan serve --host 0.0.0.0 --port ${PORT:-8080}'
